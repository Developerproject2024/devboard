name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          command -v gcc
          gcc --version
          command -v ruby
          ruby --version

      - name: Install actionlint
        run: |
          version=1.7.7
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          printf '%s  %s\n' \
            '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757' \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate workflow with actionlint
        run: actionlint .github/workflows/ci.yml

      - name: Validate workflow YAML with Ruby
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ci.yml"); puts "YAML OK"'

  test:
    needs: tooling
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go dependencies
        run: go mod download -x

      - name: Verify module dependencies
        run: go mod verify

      - name: Run CI checks
        run: make ci

  lint:
    needs: tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          install-mode: goinstall

  security:
    needs: tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  sonar:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go dependencies
        run: go mod download -x

      - name: Verify module dependencies
        run: go mod verify

      - name: Generate coverage
        run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out ./internal/...

      - name: Validate SonarCloud configuration
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_PROJECT_KEY" || { echo "SONAR_PROJECT_KEY is not configured"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "SONAR_ORGANIZATION is not configured"; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN is not configured"; exit 1; }

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.exclusions=**/bin/**,**/*_test.go,cmd/api/main.go
            -Dsonar.qualitygate.wait=true

  docs:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go dependencies
        run: go mod download -x

      - name: Verify module dependencies
        run: go mod verify

      - name: Generate OpenAPI documentation
        run: make docs

      - name: Verify documentation generated
        run: |
          test -f docs/docs.go || { echo "docs/docs.go not found"; exit 1; }
          test -f docs/swagger.json || { echo "docs/swagger.json not found"; exit 1; }
          test -f docs/swagger.yaml || { echo "docs/swagger.yaml not found"; exit 1; }
          echo "✅ Documentation generated successfully"

  build:
    needs: [test, lint, security]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build application
        run: make build

  docker:
    needs: [test, lint, security]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag devboard:test .

  merge-gate:
    needs: [test, lint, security, sonar, build, docker, docs]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require all checks to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          for result in "$TEST_RESULT" "$LINT_RESULT" "$SECURITY_RESULT" "$SONAR_RESULT" "$BUILD_RESULT" "$DOCKER_RESULT" "$DOCS_RESULT"; do
            test "$result" = success || { echo "Required check result: $result"; exit 1; }
          done

  deploy:
    needs: merge-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Deploy to production
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "RENDER_DEPLOY_HOOK is not configured"; exit 1; }
          case "$RENDER_DEPLOY_HOOK" in
            https://*) ;;
            *) echo "RENDER_DEPLOY_HOOK must use HTTPS"; exit 1 ;;
          esac
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            --location --proto '=https' --proto-redir '=https' \
            --request POST --url "$RENDER_DEPLOY_HOOK"
